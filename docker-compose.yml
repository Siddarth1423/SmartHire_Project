services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smarthire
      POSTGRES_USER: smarthire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smarthire_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smarthire -d smarthire"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://smarthire:${POSTGRES_PASSWORD:-smarthire_dev_password}@db:5432/smarthire
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
